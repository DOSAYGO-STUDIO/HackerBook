name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json; skipping npm ci"
          fi

      - name: Shell syntax check
        run: |
          bash -n download_hn.sh
          bash -n toool/s/predeploy-checks.sh
          bash -n toool/s/ci-verify.sh

      - name: Repo sanity checks
        run: bash toool/s/ci-verify.sh

      - name: Unit, Workers runtime and headless browser tests
        run: |
          npm test > /tmp/hackerbook-ci-tests.log 2>&1
          cat /tmp/hackerbook-ci-tests.log

      - name: Preserve full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: /tmp/hackerbook-ci-tests.log
          retention-days: 14
