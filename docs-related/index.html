  <script>
  (() => {
    const PAGE_SIZE = 30;
    const PATHS = {
      manifest: 'static-related-manifest.json.gz',
      top: 'related-top.json.gz',
      shards: 'static-related-shards/'
    };

    const contentEl = document.getElementById('content');
    const footerMetaEl = document.getElementById('footer-meta');
    const snapshotEl = document.getElementById('snapshot');
    const loadingStatusEl = document.getElementById('loading-status');
    const topYearsEl = document.getElementById('top-years');
    const topYearsClearEl = document.getElementById('top-years-clear');

    let sqlite3 = null;
    let manifest = null;
    let topIndex = null;
    const shardCache = new Map();
    const topSortCache = new Map();
    const CUSTOM_RANK_STORAGE_KEY = 'hb_related_custom_rank_expr_v1';
    const DEFAULT_CUSTOM_RANK_EXPR = '0.50*log1p(backlinks)+0.25*log1p(discussions)+0.15*log1p(comments)+0.10*log1p(points)';
    const CUSTOM_RANK_ALLOWED_IDS = new Set([
      'backlinks', 'discussions', 'comments', 'points', 'time', 'rank',
      'ln', 'log', 'log1p', 'sqrt', 'pow', 'min', 'max', 'abs',
      'round', 'floor', 'ceil', 'exp', 'PI', 'E'
    ]);
    let customRankExpr = '';
    let customRankFn = null;

    function qs() { return new URLSearchParams(location.search); }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }
    function fmtTime(ts) {
      if (!ts) return '';
      try {
        return new Date(ts * 1000).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch {
        return '';
      }
    }
    function dayBucket(ts) {
      const n = Number(ts || 0);
      if (!Number.isFinite(n) || n <= 0) return 0;
      return Math.floor(n / 86400);
    }
    function yearFromTs(ts) {
      const n = Number(ts || 0);
      if (!Number.isFinite(n) || n <= 0) return null;
      try {
        return new Date(n * 1000).getUTCFullYear();
      } catch {
        return null;
      }
    }
    function dayKey(ts) {
      if (!ts) return 'Unknown date';
      try {
        return new Date(ts * 1000).toISOString().slice(0, 10);
      } catch {
        return 'Unknown date';
      }
    }
    function fmtDayLabel(dayStr) {
      if (!dayStr || dayStr === 'Unknown date') return dayStr || 'Unknown date';
      try {
        const d = new Date(`${dayStr}T00:00:00Z`);
        return d.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
      } catch {
        return dayStr;
      }
    }
    const HACKERBOOK_BASE = 'https://hackerbook.dosaygo.com';
    function storyUrl(id) { return `${HACKERBOOK_BASE}/index.html?view=item&id=${encodeURIComponent(id)}`; }
    function hnDiscussionUrl(id) { return `https://news.ycombinator.com/item?id=${encodeURIComponent(id)}`; }
    function hnFromUrl(host) { return `https://hn.algolia.com/?dateRange=all&page=0&prefix=false&query=${encodeURIComponent(host)}&sort=byDate&type=story`; }
    function userUrl(by) { return `${HACKERBOOK_BASE}/index.html?view=user&id=${encodeURIComponent(by)}`; }
    function hostFromUrl(url) {
      if (!url) return '';
      try { return new URL(url).host.replace(/^www\./i, ''); } catch { return ''; }
    }
    function siteTailHtml(url) {
      const host = hostFromUrl(url);
      if (!host) return '';
      return ` <span class="sitebit comhead">(<a href="${hnFromUrl(host)}" target="_blank" rel="noopener"><span class="sitestr">${esc(host)}</span></a>)</span>`;
    }
    const INTERESTING_TITLE_STOP_WORDS = new Set([
      'the', 'a', 'an', 'and', 'or', 'to', 'of', 'for', 'on', 'in', 'is', 'are',
      'was', 'were', 'be', 'with', 'from', 'by', 'at', 'that', 'this', 'it', 'its',
      'ask', 'show', 'tell', 'hn', 'yc', 'ycombinator', '2024', '2025', '2026'
    ]);
    const INTERESTING_SIDE_SIM_THRESHOLD = 0.58;
    const INTERESTING_PAIR_SIM_THRESHOLD = 0.52;
    const INTERESTING_DUPLICATE_TITLE_THRESHOLD = 0.72;
    function isDupeLikeTitle(v) {
      const t = String(v || '').trim().toLowerCase();
      if (!t) return true;
      if (t === '[dupe]' || t === 'dupe') return true;
      if (/^\[\s*dupe\b.*\]$/.test(t)) return true;
      if (/^\s*dupe\b/.test(t)) return true;
      return false;
    }
    function cleanInterestingTitle(v) {
      const t = String(v || '').trim();
      if (!t) return null;
      if (isDupeLikeTitle(t)) return null;
      return t;
    }
    function resolvedInterestingTitle(primaryTitle, relatedTitle) {
      const a = cleanInterestingTitle(primaryTitle);
      if (a) return a;
      const b = cleanInterestingTitle(relatedTitle);
      return b || null;
    }
    function normalizeTitleLoose(title) {
      return String(title || '')
        .toLowerCase()
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u2013\u2014]/g, '-')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }
    function titleTokens(title) {
      const loose = normalizeTitleLoose(title);
      if (!loose) return [];
      const parts = loose.split(/\s+/g);
      const uniq = new Set();
      for (const p of parts) {
        if (!p || p.length < 3) continue;
        if (/^\d+$/.test(p)) continue;
        if (INTERESTING_TITLE_STOP_WORDS.has(p)) continue;
        uniq.add(p);
      }
      let out = [...uniq];
      if (!out.length) {
        out = [...new Set(parts.filter((p) => p && p.length >= 2 && !/^\d+$/.test(p)))];
      }
      out.sort();
      return out;
    }
    function jaccardSortedTokens(a, b) {
      if (!a.length || !b.length) return 0;
      let i = 0;
      let j = 0;
      let inter = 0;
      while (i < a.length && j < b.length) {
        if (a[i] === b[j]) {
          inter += 1;
          i += 1;
          j += 1;
          continue;
        }
        if (a[i] < b[j]) i += 1;
        else j += 1;
      }
      const union = a.length + b.length - inter;
      return union > 0 ? (inter / union) : 0;
    }
    function storyPairId(row) {
      return `${Number(row?.source_story_id || 0)}:${Number(row?.target_story_id || 0)}`;
    }
    function aggregateInterestingRows(rows, opts = {}) {
      const withGroups = Boolean(opts && opts.withGroups);
      const groups = [];
      for (const row of (rows || [])) {
        const sourceResolvedTitle = resolvedInterestingTitle(row?.source_title, row?.target_title);
        const targetResolvedTitle = resolvedInterestingTitle(row?.target_title, row?.source_title);
        const sourceTitle = String(sourceResolvedTitle || `[story ${row?.source_story_id || '?'}]`);
        const targetTitle = String(targetResolvedTitle || `[story ${row?.target_story_id || '?'}]`);
        const sourceNorm = normalizeTitleLoose(sourceTitle);
        const targetNorm = normalizeTitleLoose(targetTitle);
        const sourceTokens = titleTokens(sourceTitle);
        const targetTokens = titleTokens(targetTitle);
        const crossTitleSim = (sourceNorm && targetNorm && sourceNorm === targetNorm)
          ? 1
          : jaccardSortedTokens(sourceTokens, targetTokens);
        const rowLooksDuplicate = (sourceNorm && targetNorm && sourceNorm === targetNorm) || (crossTitleSim >= INTERESTING_DUPLICATE_TITLE_THRESHOLD);

        let bestIdx = -1;
        let bestPairSim = -1;
        for (let i = 0; i < groups.length; i += 1) {
          const g = groups[i];
          const sourceSim = (sourceNorm && sourceNorm === g.sourceNorm)
            ? 1
            : jaccardSortedTokens(sourceTokens, g.sourceTokens);
          const targetSim = (targetNorm && targetNorm === g.targetNorm)
            ? 1
            : jaccardSortedTokens(targetTokens, g.targetTokens);
          const pairSim = (sourceSim + targetSim) / 2;
          const sameTheme =
            (sourceSim >= INTERESTING_SIDE_SIM_THRESHOLD && targetSim >= INTERESTING_SIDE_SIM_THRESHOLD) ||
            (pairSim >= INTERESTING_PAIR_SIM_THRESHOLD);
          if (sameTheme && pairSim > bestPairSim) {
            bestPairSim = pairSim;
            bestIdx = i;
          }
        }

        if (bestIdx < 0) {
          groups.push({
            sourceNorm,
            targetNorm,
            sourceTokens,
            targetTokens,
            rep: row,
            rawRows: [row],
            repSourceTitle: sourceResolvedTitle,
            repTargetTitle: targetResolvedTitle,
            entropyMax: Number(row?.entropy_score || 0),
            entropySum: Number(row?.entropy_score || 0),
            evidenceSum: Number(row?.evidence_count || 0),
            weightedDen: Math.max(1, Number(row?.evidence_count || 1)),
            noveltyWeighted: Number(row?.novelty || 0) * Math.max(1, Number(row?.evidence_count || 1)),
            semanticWeighted: Number(row?.semantic_support || 0) * Math.max(1, Number(row?.evidence_count || 1)),
            lexicalWeighted: Number(row?.lexical_sim || 0) * Math.max(1, Number(row?.evidence_count || 1)),
            weightWeighted: Number(row?.weight || 0) * Math.max(1, Number(row?.evidence_count || 1)),
            duplicateWeighted: crossTitleSim * Math.max(1, Number(row?.evidence_count || 1)),
            duplicateHits: rowLooksDuplicate ? 1 : 0,
            sourceStoryIds: new Set([Number(row?.source_story_id)]),
            targetStoryIds: new Set([Number(row?.target_story_id)]),
            pairIds: new Set([`${Number(row?.source_story_id)}:${Number(row?.target_story_id)}`]),
            rowCount: 1,
            sourceMinTime: Number(row?.source_time || 0) || 0,
            sourceMaxTime: Number(row?.source_time || 0) || 0,
            targetMinTime: Number(row?.target_time || 0) || 0,
            targetMaxTime: Number(row?.target_time || 0) || 0
          });
          continue;
        }

        const g = groups[bestIdx];
        const entropy = Number(row?.entropy_score || 0);
        const evidence = Math.max(1, Number(row?.evidence_count || 1));
        g.rowCount += 1;
        g.entropySum += entropy;
        g.evidenceSum += Number(row?.evidence_count || 0);
        g.weightedDen += evidence;
        g.noveltyWeighted += Number(row?.novelty || 0) * evidence;
        g.semanticWeighted += Number(row?.semantic_support || 0) * evidence;
        g.lexicalWeighted += Number(row?.lexical_sim || 0) * evidence;
        g.weightWeighted += Number(row?.weight || 0) * evidence;
        g.duplicateWeighted += crossTitleSim * evidence;
        g.duplicateHits += rowLooksDuplicate ? 1 : 0;
        g.rawRows.push(row);
        g.sourceStoryIds.add(Number(row?.source_story_id));
        g.targetStoryIds.add(Number(row?.target_story_id));
        g.pairIds.add(`${Number(row?.source_story_id)}:${Number(row?.target_story_id)}`);
        const sourceTime = Number(row?.source_time || 0) || 0;
        const targetTime = Number(row?.target_time || 0) || 0;
        if (!g.sourceMinTime || (sourceTime && sourceTime < g.sourceMinTime)) g.sourceMinTime = sourceTime;
        if (sourceTime > g.sourceMaxTime) g.sourceMaxTime = sourceTime;
        if (!g.targetMinTime || (targetTime && targetTime < g.targetMinTime)) g.targetMinTime = targetTime;
        if (targetTime > g.targetMaxTime) g.targetMaxTime = targetTime;
        if (entropy > g.entropyMax) {
          g.entropyMax = entropy;
          g.rep = row;
          g.repSourceTitle = sourceResolvedTitle;
          g.repTargetTitle = targetResolvedTitle;
          g.sourceNorm = sourceNorm || g.sourceNorm;
          g.targetNorm = targetNorm || g.targetNorm;
          g.sourceTokens = sourceTokens.length ? sourceTokens : g.sourceTokens;
          g.targetTokens = targetTokens.length ? targetTokens : g.targetTokens;
        }
      }

    function validateCustomRankExpression(rawExpr) {
      const expr = String(rawExpr || '').trim();
      if (!expr) throw new Error('Expression cannot be empty.');
      if (expr.length > 400) throw new Error('Expression too long (max 400 chars).');
      if (/[;"'`[\]{}\\]/.test(expr)) throw new Error('Quotes, brackets, braces, semicolons, and backslashes are not allowed.');
      if (!/^[0-9+\-*/%().,?:<>=!&|\sA-Za-z_]+$/.test(expr)) throw new Error('Unsupported character in expression.');
      if (/(^|[^!<>=])=($|[^=])/.test(expr)) throw new Error('Assignment is not allowed; use comparisons only.');
      if (/\b[A-Za-z_]\w*\s*\./.test(expr)) throw new Error('Property access is not allowed.');

        const backlinks = Math.max(0, Number(row?.incoming_link_count || 0));
        const discussions = Math.max(0, Number(row?.member_count || 0));
        const comments = Math.max(0, Number(row?.comment_count || 0));
        const points = Math.max(0, Number(row?.story_points_sum || 0));
        const time = Math.max(0, Number(row?.time || 0));
        const rank = Math.max(0, Number(row?.rank || 0));
        const ln = Math.log;
        const log = Math.log;
        const log1p = Math.log1p;
        const sqrt = Math.sqrt;
        const pow = Math.pow;
        const min = Math.min;
        const max = Math.max;
        const abs = Math.abs;
        const round = Math.round;
        const floor = Math.floor;
        const ceil = Math.ceil;
        const exp = Math.exp;
        const PI = Math.PI;
        const E = Math.E;
        const out = (${expr});
        return Number.isFinite(out) ? Number(out) : -Infinity;
      `);
      const testOut = fn({ incoming_link_count: 10, member_count: 5, comment_count: 200, story_points_sum: 500, time: 1700000000, rank: 100 });

    async function fetchBytes(url) {
      const r = await fetch(url, { cache: 'no-cache' });
      if (!r.ok) throw new Error(`Fetch failed ${r.status}: ${url}`);
      return new Uint8Array(await r.arrayBuffer());
    }

    async function maybeGunzip(u8) {
      if (u8.length >= 2 && u8[0] === 0x1f && u8[1] === 0x8b) {
        if (typeof DecompressionStream !== 'undefined') {
          const ds = new DecompressionStream('gzip');
          const stream = new Response(u8).body.pipeThrough(ds);
          const buf = await new Response(stream).arrayBuffer();
          return new Uint8Array(buf);
        }
        throw new Error('This browser does not support DecompressionStream.');
      }
      return u8;
    }

    async function fetchJsonMaybeGzip(url) {
      const u8 = await fetchBytes(url);
      const raw = await maybeGunzip(u8);
      return JSON.parse(new TextDecoder('utf-8').decode(raw));
    }

    function sqlAll(db, sql, bind = []) {
      return db.exec({ sql, bind, rowMode: 'object', returnValue: 'resultRows' }) || [];
    }
    function sqlOne(db, sql, bind = []) {
      const rows = sqlAll(db, sql, bind);
      return rows[0] || null;
    }

    function shardRecForRank(rank) {
      const x = Number(rank);

      }
      return null;

    async function loadShardBySid(sid) {
      if (shardCache.has(sid)) return shardCache.get(sid);
      const rec = (manifest.shards || []).find((s) => Number(s.sid) === Number(sid));
      if (!rec) throw new Error(`Missing shard sid=${sid}`);
      const u8 = await fetchBytes(PATHS.shards + rec.file);
      const raw = await maybeGunzip(u8);
      const p = sqlite3.wasm.allocFromTypedArray(raw);
      const db = new sqlite3.oo1.DB();
      sqlite3.capi.sqlite3_deserialize(
        db.pointer,
        'main',
        p,
        raw.byteLength,
        raw.byteLength,
        sqlite3.capi.SQLITE_DESERIALIZE_FREEONCLOSE
      );
      shardCache.set(sid, db);
      return db;

      contentEl.innerHTML = `
        <div class="row">
          <div class="title"><a href="${backHref}">&larr; BACK TO HN-TROPY</a></div>
          <div class="hr"></div>
        </div>
        <div class="about">
          <h3>How HN-TROPY Works</h3>
          <p>Every HN comment is scanned for links to other HN stories. When a comment on Story&nbsp;A links to Story&nbsp;B, that&rsquo;s a <b>backlink</b> &mdash; evidence that the two discussions are related.</p>
          <h4>Link extraction</h4>
          <p>Regex patterns scan all comment text for <code>item?id=</code> references. Comments that say &ldquo;related:&rdquo; or &ldquo;past:&rdquo; get a keyword boost. Each comment can contribute up to 12 outbound links.</p>
          <h4>Story resolution</h4>
          <p>Comments live deep in reply chains. A recursive walk up the parent chain (up to 40 levels) maps each comment back to its root story, so the link is attributed to the right discussion.</p>
          <h4>Similarity scoring</h4>
          <p>Each story gets a token profile: title and text, lowercased, with stop-words removed. For every pair of linked stories, a <b>Jaccard similarity</b> score measures how much their tokens overlap. Edge weights combine source alignment (how similar the linking story is to its targets) with self-consistency (how similar the targets are to each other). Low-quality edges are pruned.</p>
          <h4>Clustering</h4>
          <p>A <b>union-find</b> algorithm groups stories into connected components. If Story&nbsp;A links to Story&nbsp;B, and Story&nbsp;B links to Story&nbsp;C, all three join the same cluster &mdash; a constellation of related discussions that can span years.</p>
          <h4>Ranking</h4>
          <p>Clusters are ranked by aggregate story points and comment volume. The top index is precomputed. Individual cluster data lives in gzip-compressed SQLite shards that load on demand.</p>
          <h4>Everything runs in your browser</h4>
          <p>The database is split into ~15&nbsp;MB SQLite shards. <b>sqlite3-wasm</b> (1&nbsp;MB) executes queries client-side via WebAssembly. There is no server-side search &mdash; just static files on a CDN.</p>
        </div>
      `;
      if (footerMetaEl) footerMetaEl.textContent = 'About HN-TROPY.';

            q.delete('cid');
            q.delete('pair');
            location.search = q.toString();
          });
        }
        const cid = p.get('cid');
        const pair = p.get('pair');
        if (p.has('about')) {
          renderAbout(sort, yearSet);
        } else if (pair) {
          await renderInterestingEvidence(pair, page, yearSet);
        } else if (cid) {
          await renderCluster(cid, page, sort, yearSet);
        } else {
          await renderTopList(page, sort, yearSet);
        }
        document.body.classList.remove('loading');
      } catch (err) {
        document.body.classList.remove('loading');
        contentEl.innerHTML = `<div class="row mono">${esc(err && err.message ? err.message : String(err))}</div>`;
      }
    }

    init();
  })();
  </script>
</body>
</html>
